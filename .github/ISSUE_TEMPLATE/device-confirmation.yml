name: "✅ Device Confirmation"
description: Report that Coolerdash works (or doesn’t) on your device
labels: ["device-confirmation"]
title: "[Device] Confirmation: <Manufacturer Model>"
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve the Coolerdash compatibility list!  
        Please run "coolerdash --hardware-report --test-lcd" for a new or
        unknown LCD model. Review the generated JSON and Markdown files;
        nothing is uploaded automatically.

  - type: input
    id: manufacturer
    attributes:
      label: Manufacturer
      placeholder: "e.g. ASUS, MSI, NZXT"
    validations:
      required: true

  - type: input
    id: model
    attributes:
      label: Model / Device
      placeholder: "e.g. NZXT Kraken Plus 360 RGB (2025)"
    validations:
      required: true

  - type: dropdown
    id: status
    attributes:
      label: Status
      options:
        - ✅ Working
        - ⚠️ Partially working
        - ❌ Not working
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating System / Distro
      placeholder: "e.g. Ubuntu 24.04, Arch Linux"
    validations:
      required: true

  - type: textarea
    id: hardware_report
    attributes:
      label: CoolerDash Hardware Report
      description: Attach the generated JSON file and paste the Markdown summary here.
      placeholder: Drag the JSON report here, then paste the Markdown summary.
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Additional Notes
      placeholder: "Any extra details, quirks, or setup steps"
